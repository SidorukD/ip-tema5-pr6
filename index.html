<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Альбомы</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            color: #333;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        .top-panel {
            margin-bottom: 20px;
        }

        select {
            padding: 5px;
            font-size: 16px;
            width: 300px;
        }

        #loading {
            color: #0056b3;
            font-weight: bold;
            margin-bottom: 10px;
        }

        #error {
            color: red;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .author-box {
            background-color: white;
            border: 1px solid #ccc;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 5px;
        }

        .author-box h3 {
            margin-top: 0;
            margin-bottom: 10px;
        }

        .author-box p {
            margin: 5px 0;
        }

        .photos-box {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
        }

        .card {
            width: 180px;
            background-color: white;
            border: 1px solid #ccc;
            padding: 10px;
            border-radius: 5px;
        }

        .card img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            display: block;
            margin-bottom: 8px;
        }

        .card-text {
            font-size: 13px;
            line-height: 18px;
            height: 36px;
            overflow: hidden;
            margin: 0;
        }
    </style>
    <script src="my.js" defer></script>
</head>
<body>

<div class="container">
    <h1>Альбомы и их авторы</h1>
    
    <div class="top-panel">
        <label>Выберите альбом: </label>
        <select id="select">
            <option value="">Загрузка...</option>
        </select>
    </div>

    <div id="loading"></div>
    <div id="error"></div>

    <div id="content" style="display: none;">
        <div id="author" class="author-box"></div>
        <h2>Фотографии альбома</h2>
        <div id="photos" class="photos-box"></div>
    </div>
</div>

</body>
</html>
